{% extends "base.html" %}{% block title %}{{ title }}{% endblock %}{% block content %}
<div class="page-head"><div><h1>{{ title }}</h1><div class="muted">Use the fields from the existing database table.</div></div></div>
<div class="card"><form method="POST" action="{{ action }}"><div class="form-grid">{% for col in columns %}<div><label>{{ col.COLUMN_NAME|replace('_',' ')|title }}{% if col.IS_NULLABLE == 'NO' %} *{% endif %}</label><input name="{{ col.COLUMN_NAME }}" type="{{ 'date' if col.DATA_TYPE=='date' else ('number' if col.DATA_TYPE in ['int','bigint','decimal','float','double'] else 'text') }}" value="{{ record[col.COLUMN_NAME] if record and record[col.COLUMN_NAME] is not none else '' }}" {% if col.IS_NULLABLE == 'NO' %}required{% endif %}></div>{% endfor %}</div><div class="actions" style="margin-top:22px"><button type="submit">Save</button><a class="button secondary" href="{{ request.referrer or url_for('dashboard') }}">Cancel</a></div></form></div>
{% endblock %}
