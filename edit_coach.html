<!DOCTYPE html>
<html>
<head>
    <title>Edit Coach</title>
</head>

<body>

<h1>Edit Coach</h1>

<form method="POST">

    <label>Name:</label>
    <input
        type="text"
        name="name"
        value="{{ coach.Name }}"
        required
    >

    <br><br>

    <label>Experience (Years):</label>
    <input
        type="number"
        name="experience"
        value="{{ coach.Experience }}"
        min="0"
    >

    <br><br>

    <label>Contact:</label>
    <input
        type="text"
        name="contact"
        value="{{ coach.Contact }}"
    >

    <br><br>

    <label>Sport:</label>

    <select name="sport_id" required>

        {% for sport in sports %}

        <option
            value="{{ sport.Sport_ID }}"
            {% if sport.Sport_ID == coach.Sport_ID %}selected{% endif %}
        >
            {{ sport.Sport_Name }}
        </option>

        {% endfor %}

    </select>

    <br><br>

    <button type="submit">Update Coach</button>

</form>

<br>

<a href="{{ url_for('coaches') }}">
    <button>Cancel</button>
</a>

</body>
</html>
