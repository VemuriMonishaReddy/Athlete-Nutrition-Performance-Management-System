<!DOCTYPE html>
<html>
<head>
    <title>
        {% if edit_mode %}
            Edit Sport
        {% else %}
            Add Sport
        {% endif %}
    </title>
</head>

<body>

    <h1>
        {% if edit_mode %}
            Edit Sport
        {% else %}
            Add Sport
        {% endif %}
    </h1>

    <form method="POST">

        <label>Sport Name:</label>

        <input
            type="text"
            name="sport_name"
            value="{{ sport.Sport_Name if sport else '' }}"
            required
        >

        <br><br>

        <button type="submit">
            {% if edit_mode %}
                Update Sport
            {% else %}
                Add Sport
            {% endif %}
        </button>

    </form>

    <br>

    <a href="{{ url_for('sports') }}">
        <button>Back to Sports</button>
    </a>

</body>
</html>
