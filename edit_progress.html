<!DOCTYPE html>
<html>
<head>
<title>Edit Progress</title>
</head>

<body>

<h1>Edit Progress</h1>

<form method="POST">

<label>Athlete:</label>

<select name="athlete_id" required>

{% for a in athletes %}

<option value="{{ a.Athlete_ID }}"
{% if a.Athlete_ID == progress.Athlete_ID %}
selected
{% endif %}>

{{ a.Name }}

</option>

{% endfor %}

</select>

<br><br>

<label>Record Date:</label>

<input type="date"
name="record_date"
value="{{ progress.Record_Date }}"
required>

<br><br>

<label>Weight:</label>

<input type="number"
step="0.01"
name="weight"
value="{{ progress.Weight or '' }}">

<br><br>

<label>BMI:</label>

<input type="number"
step="0.01"
name="bmi"
value="{{ progress.BMI or '' }}">

<br><br>

<label>Body Fat Percentage:</label>

<input type="number"
step="0.01"
name="body_fat_percentage"
value="{{ progress.Body_Fat_Percentage or '' }}">

<br><br>

<label>Notes:</label>

<input type="text"
name="notes"
value="{{ progress.Notes or '' }}">

<br><br>

<button type="submit">
Update Progress
</button>

</form>

<br>

<a href="{{ url_for('progress') }}">
<button>Back</button>
</a>

</body>
</html>
