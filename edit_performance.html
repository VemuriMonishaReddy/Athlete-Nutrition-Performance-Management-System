<!DOCTYPE html>
<html>
<head>
<title>Edit Performance</title>
</head>

<body>

<h1>Edit Performance</h1>

<form method="POST">

<label>Athlete:</label>

<select name="athlete_id" required>

{% for a in athletes %}

<option value="{{ a.Athlete_ID }}"
{% if a.Athlete_ID == performance.Athlete_ID %}
selected
{% endif %}>

{{ a.Name }}

</option>

{% endfor %}

</select>

<br><br>

<label>Competition:</label>

<select name="competition_id" required>

{% for c in competitions %}

<option value="{{ c.Competition_ID }}"
{% if c.Competition_ID == performance.Competition_ID %}
selected
{% endif %}>

{{ c.Competition_Name }}

</option>

{% endfor %}

</select>

<br><br>

<label>Score:</label>

<input type="number"
step="0.01"
name="score"
value="{{ performance.Score or '' }}">

<br><br>

<label>Rank:</label>

<input type="number"
name="rank_position"
value="{{ performance.Rank_Position or '' }}">

<br><br>

<label>Medal:</label>

<input type="text"
name="medal"
value="{{ performance.Medal or '' }}">

<br><br>

<label>Performance Date:</label>

<input type="date"
name="performance_date"
value="{{ performance.Performance_Date }}"
required>

<br><br>

<button type="submit">
Update Performance
</button>

</form>

<br>

<a href="{{ url_for('performance') }}">
<button>Back</button>
</a>

</body>
</html>
