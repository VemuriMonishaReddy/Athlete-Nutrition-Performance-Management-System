<!DOCTYPE html>

<head>
    <title>Add Nutritionist</title>
</head>
<body>

<h1>Add Nutritionist</h1>

<form method="POST">

<br>

<a href="{{ url_for('nutritionists') }}">
    <button>Back</button>
</a>

</body>
</html>
