<!DOCTYPE html>
<html>
<head>
<title>Add Performance</title>
</head>

<body>

<h1>Add Performance</h1>

<form method="POST">

<label>Athlete:</label>

<select name="athlete_id" required>

{% for a in athletes %}

<option value="{{ a.Athlete_ID }}">
{{ a.Name }}
</option>

{% endfor %}

</select>

<br><br>

<label>Competition:</label>

<select name="competition_id" required>

{% for c in competitions %}

<option value="{{ c.Competition_ID }}">
{{ c.Competition_Name }}
</option>

{% endfor %}

</select>

<br><br>

<label>Score:</label>

<input type="number"
step="0.01"
name="score">

<br><br>

<label>Rank:</label>

<input type="number"
name="rank_position">

<br><br>

<label>Medal:</label>

<input type="text"
name="medal">

<br><br>

<label>Performance Date:</label>

<input type="date"
name="performance_date"
required>

<br><br>

<button type="submit">
Add Performance
</button>

</form>

<br>

<a href="{{ url_for('performance') }}">
<button>Back</button>
</a>

</body>
</html>
