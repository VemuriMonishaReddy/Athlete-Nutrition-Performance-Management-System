<!DOCTYPE html>
<html>
<head>
    <title>Edit Nutritionist</title>
</head>
<body>

<h1>Edit Nutritionist</h1>

<form method="POST">

    <label>Name:</label>
    <input type="text"
           name="name"
           value="{{ nutritionist.Name }}"
           required>

    <br><br>

    <label>Qualification:</label>
    <input type="text"
           name="qualification"
           value="{{ nutritionist.Qualification }}">

    <br><br>

    <label>Contact:</label>
    <input type="text"
           name="contact"
           value="{{ nutritionist.Contact }}">

    <br><br>

    <button type="submit">Update Nutritionist</button>

</form>

<br>

<a href="{{ url_for('nutritionists') }}">
    <button>Back</button>
</a>

</body>
</html>
